# General
graphQLEndpoint=https://portal.ehri-project.eu/api/graphql
querySparqlEndpoint=http://localhost:3030/ehri/query
updateSparqlEndpoint=http://localhost:3030/ehri/update
insertSparqlQuery=conf/sparqlInsertData.rq
eventDetailsSparqlQuery=conf/sparqlGetEventDetails.rq
resumeFromEventId=
# Overrides the STREAM URL of the SSE mapping rules when set
sseEndpoint=

# Shapes validating each entity type's mapped data: <shapes>.shex with the shape map <shapes>.smap, and
# <shapes>.shacl.ttl. Violations are logged and reported, and the data is applied regardless. Types whose
# <type>Shapes property is unset or empty are not validated.

# Database
databasePath=db/eventsHistory.db
databaseCreationScript=db/creation.sql

# Institutions
institutionsGraphQLQuery=conf/institutions/institutionsGraphQLQuery.txt
institutionsShexmlMappingRules=conf/institutions/institutionsMappingRules.shexml
institutionsDeleteSparqlQuery=conf/institutions/sparqlDeleteInstitutionData.rq
institutionsConstructSparqlQuery=conf/institutions/institutionsSparqlConstruct.rq
institutionsShapes=conf/shapes/repositories

# Countries
countriesGraphQLQuery=conf/countries/countriesGraphQLQuery.txt
countriesShexmlMappingRules=conf/countries/countriesMappingRules.shexml
countriesDeleteSparqlQuery=conf/countries/sparqlDeleteCountryData.rq
countriesConstructSparqlQuery=conf/countries/countriesSparqlConstruct.rq
countriesShapes=conf/shapes/countries

# Archival descriptions
archivalDescriptionsGraphQLQuery=conf/archivalDescriptions/archivalDescriptionsGraphQLQuery.txt
archivalDescriptionsShexmlMappingRules=conf/archivalDescriptions/archivalDescriptionsMappingRules.shexml
archivalDescriptionsDeleteSparqlQuery=conf/archivalDescriptions/sparqlDeleteArchivalDescriptionData.rq
archivalDescriptionsConstructSparqlQuery=conf/archivalDescriptions/archivalDescriptionsSparqlConstruct.rq
archivalDescriptionsShapes=conf/shapes/holdings

# Vocabularies
vocabulariesGraphQLQuery=conf/vocabularies/vocabulariesGraphQLQuery.txt
vocabulariesShexmlMappingRules=conf/vocabularies/vocabulariesMappingRules.shexml
vocabulariesDeleteSparqlQuery=conf/vocabularies/sparqlDeleteVocabularyData.rq
vocabulariesConstructSparqlQuery=conf/vocabularies/vocabulariesSparqlConstruct.rq

# Historical agents
historicalAgentsGraphQLQuery=conf/historicalAgents/historicalAgentsGraphQLQuery.txt
corporateBodiesShexmlMappingRules=conf/historicalAgents/corporateBodiesMappingRules.shexml
personsShexmlMappingRules=conf/historicalAgents/personsMappingRules.shexml
historicalAgentsDeleteSparqlQuery=conf/historicalAgents/sparqlDeleteHistoricalAgentData.rq
historicalAgentsConstructSparqlQuery=conf/historicalAgents/historicalAgentsSparqlConstruct.rq
corporateBodiesShapes=conf/shapes/cb
personsShapes=conf/shapes/people

# Links
linksGraphQLQuery=conf/links/linksGraphQLQuery.txt
linksShexmlMappingRules=conf/links/linksMappingRules.shexml
linksDeleteSparqlQuery=conf/links/sparqlDeleteLinkData.rq
linksConstructSparqlQuery=conf/links/linksSparqlConstruct.rq

# Batch conversion
# The authority sets and vocabularies to convert, comma-separated, by the mapping rules they use. Only EHRI's own
# sets are in the KG; see inEhriSet.
batchPersonSets=ehri_pers
batchCorporateBodySets=ehri_cb,ehri_fm
batchVocabularySets=ehri_terms,ehri_camps,ehri_ghettos
# The number of items mapped at a time: mapping a chunk slows as it grows, so about 100 is fastest
batchChunkSize=100