name: Kotlin CI

on: push

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
      - name: Build the docker compose stack
        run: docker compose -f src/test/resources/docker-compose.yml up -d
      - name: Grant permission embedded Gradle
        run: chmod +x gradlew
      - name: Run tests
        run: ./gradlew test